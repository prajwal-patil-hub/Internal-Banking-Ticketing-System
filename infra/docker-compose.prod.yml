# SUCCESS Bank — production stack
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#   docker compose -f infra/docker-compose.prod.yml exec backend alembic upgrade head
#
# Differences from the development file, all deliberate:
#
#   - No source bind mounts. The image is the artefact; a mount means the
#     running code is whatever happens to be on that host's disk.
#   - No default passwords. Every secret is a required variable, so a missing
#     one stops the deploy instead of silently shipping `success_dev_pw`.
#   - Only the web tier publishes a port. Postgres, Redis and MinIO are
#     reachable on the internal network and nowhere else.
#   - Images are pulled by tag, not built here, so what runs in production is
#     the artefact CI built and tested.
#
# Required environment (see .env.prod.example):
#   IMAGE_TAG, POSTGRES_PASSWORD, JWT_SECRET, PASSWORD_PEPPER,
#   S3_ACCESS_KEY, S3_SECRET_KEY

name: success-bank-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-success}
      # No default: `:?` makes compose refuse to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-success_bank}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-success} -d ${POSTGRES_DB:-success_bank}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    <<: *restart
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-prajwal-patil-hub/internal-banking-ticketing-system}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    <<: *restart
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-success}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-success_bank}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-success-attachments}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      APP_ENV: production
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-glm4}
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
    volumes:
      # Backups are the one thing that must outlive the container.
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [internal]

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-prajwal-patil-hub/internal-banking-ticketing-system}/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    <<: *restart
    ports:
      # The only published port. Put a TLS terminator in front of it before
      # this faces anything but a trusted network — nothing here speaks HTTPS.
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend: {condition: service_started}
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  internal:
    driver: bridge
