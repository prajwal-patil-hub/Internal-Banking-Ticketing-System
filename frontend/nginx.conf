# Serves the built SPA and proxies the API to the backend.
#
# The proxy is not optional. `src/lib/api.ts` falls back to a same-origin
# `/api/v1` base when VITE_API_BASE_URL is unset, which is the right default —
# it avoids CORS entirely and keeps cookies first-party. But it means nginx has
# to forward /api itself; serving only static files here gives a site that
# loads and then 404s every request it makes.

upstream backend {
  # `backend` is the compose service name. `resolve` is deliberately not used:
  # with a static upstream nginx fails to start if the name does not resolve,
  # which surfaces a misconfiguration at deploy time rather than as 502s later.
  server backend:8000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Large enough for a 15 MB attachment plus multipart overhead. nginx's 1 MB
  # default would reject uploads with a 413 before they reached the size check
  # in the API, and the message the user saw would not mention the real limit.
  client_max_body_size 20m;

  # Compress what benefits; images and PDFs are already compressed.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # --- API ------------------------------------------------------------------
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # The AI assistant streams tokens over SSE. Buffering would hold the whole
    # response until completion, turning a live stream into one late blob.
    proxy_buffering off;
    proxy_cache off;

    # A local model can take a while to produce its first token; the backend's
    # own budget is AI_TIMEOUT_SECONDS (180s by default). Sitting just above it
    # means the API's own error message wins rather than a 504 from nginx.
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
  }

  # --- Static ---------------------------------------------------------------

  # Vite fingerprints these filenames, so a changed file is a changed URL and
  # the cached copy can never be stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html must never be cached: it is the document that names the current
  # fingerprinted bundles, so a cached copy pins the browser to a deployment
  # that no longer exists.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Container-level liveness, answered without touching the backend.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # --- Security headers -----------------------------------------------------
  #
  # `always` so they are present on error responses too, which is where a
  # missing X-Content-Type-Options actually bites.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
