name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Lets CD reuse these exact checks instead of trusting that some earlier run
  # was green — see .github/workflows/cd.yml.
  workflow_call:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against PostgreSQL because the application does. Several
    # tests depend on Postgres behaviour that SQLite does not reproduce —
    # ARRAY columns, `now()` as transaction start time — so passing on SQLite
    # would mean nothing about whether the code works.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: success_bank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/success_bank_test
      JWT_SECRET: test_secret_must_be_at_least_32_characters_long
      PASSWORD_PEPPER: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # Still advisory: the annotations are incomplete and turning this into a
      # gate today would block every unrelated change. It runs so the output is
      # visible in the log rather than silently skipped.
      - name: Mypy (advisory)
        run: mypy app || true

      - name: Migrate
        run: alembic upgrade head

      # Catches the failure mode that let `inbound_emails` drift eleven columns
      # from its model: a migration that was never written. Restricted to
      # tables and columns, because server-default and index comparisons are
      # noisy by design and would fail on every run.
      - name: Check for model/schema drift
        run: |
          if alembic check > /tmp/alembic-check.log 2>&1; then
            echo "No drift: models and migrations agree."
            exit 0
          fi

          # `alembic check` exits non-zero for three different reasons, and
          # they must not be conflated. An earlier version of this step piped
          # through `|| true` and then grepped for drift markers, so a check
          # that never connected produced no markers and was reported as a
          # pass — the exact false-negative this gate exists to prevent.
          if grep -qE "'(add|remove)_(table|column)'" /tmp/alembic-check.log; then
            echo "::error::Models and migrations disagree — a migration is missing."
            grep -oE "'(add|remove)_(table|column)'[^)]*" /tmp/alembic-check.log | head -20
            exit 1
          elif grep -q "New upgrade operations detected" /tmp/alembic-check.log; then
            # Server defaults and index comparisons differ by design between
            # SQLAlchemy's python-side defaults and the migrations. Noisy, not
            # a defect.
            echo "Only server-default/index differences; no table or column drift."
            exit 0
          else
            echo "::error::alembic check did not run — see log below."
            cat /tmp/alembic-check.log
            exit 1
          fi

      # No fallback. This step failing must fail the build — the previous
      # `pytest -q || pytest --collect-only -q` reported success whenever the
      # tests failed, which is worse than having no CI at all.
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # The lockfile, not package.json: keying the cache on the manifest
          # reuses a cache that does not match the installed tree.
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`, so the build uses the locked versions and
      # cannot silently drift from what was tested locally.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
