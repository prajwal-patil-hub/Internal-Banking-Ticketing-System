[project]
name = "success-bank-backend"
version = "0.1.0"
description = "SUCCESS Bank — internal ticketing & CRM backend"
requires-python = ">=3.12"
dependencies = [
  # --- Web framework ---
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "python-multipart==0.0.9",

  # --- Validation & settings ---
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "email-validator==2.2.0",

  # --- DB ---
  "sqlalchemy[asyncio]==2.0.35",
  "asyncpg==0.29.0",
  "alembic==1.13.3",

  # --- Auth & security ---
  "argon2-cffi==23.1.0",
  "pyjwt[crypto]==2.9.0",
  "pyotp==2.9.0",
  "segno==1.6.1",   # pure-python QR codes for MFA enrolment

  # --- Caching / queues ---
  "redis==5.0.8",

  # --- Scheduler ---
  "apscheduler==3.10.4",

  # --- Storage ---
  "boto3==1.35.30",

  # --- Observability ---
  "structlog==24.4.0",
  "prometheus-client==0.21.0",

  # --- AI ---
  "openai>=1.54.0",

  # --- Email / file handling ---
  "aiosmtplib==3.0.1",
  "aiofiles==24.1.0",
  "python-magic==0.4.27",

  # --- Report generation ---
  "openpyxl==3.1.5",
  "reportlab==4.2.5",

  # --- Misc ---
  "httpx==0.27.2",
  "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "moto[s3]==5.2.2",  # in-process S3 so attachment tests need no MinIO container
  "ruff==0.6.9",
  "mypy==1.11.2",
  "types-redis==4.6.0.20240903",
]

[tool.setuptools]
# `app` and `alembic` both sit at the top level, and setuptools refuses to
# guess between them — it fails the install outright rather than package the
# wrong tree. Naming the one importable package is the fix; `alembic` is
# migration scripts run from the working directory, never imported.
packages = ["app"]

[tool.ruff]
# 120, not 100: the code was written to roughly this width throughout, and at
# 100 the rule fired 51 times on lines of 101–119 characters. That is a style
# disagreement reported as 51 defects, which trains people to skim lint output
# — the opposite of what a gate is for. At 120 it still catches the genuinely
# unreadable ones, and those were fixed rather than silenced.
line-length = 120
target-version = "py312"
# Migrations are a historical record, not maintained source. Reformatting an
# applied migration to satisfy a style rule risks changing what it does, for a
# file nobody reads except when tracing a schema change.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N", "RUF"]
ignore = [
  "S101",    # allow asserts in tests
  "UP042",   # StrEnum migration is cosmetic; existing str+Enum pattern is fine
  "B008",    # FastAPI Depends() in function defaults is the canonical pattern
  "B904",    # raise-from inside route handlers clutters API error code
]

[tool.ruff.lint.per-file-ignores]
# `MockAudit` and friends are class-like stand-ins, so the class naming reads
# correctly even inside a function. S105/S106 fire on every test password.
"tests/*" = ["S105", "S106", "N806", "E501"]
# Seed scripts are one-shot fixtures: long literal rows are the readable form,
# the demo passwords they set are the whole point, and the randomness picks
# which fake ticket gets which fake priority — `secrets` would buy nothing.
"scripts/*" = ["S105", "S106", "E501", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
